<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion des Rendez-vous</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<div class="max-w-6xl mx-auto p-6">
  <h1 class="text-3xl font-bold mb-6">📅 Gestion des Rendez-vous</h1>

  <div class="grid md:grid-cols-4 gap-4 mb-6">
    <div class="bg-white rounded-xl p-4 shadow">
      <div class="text-gray-500">Total RDV</div>
      <div id="total" class="text-3xl font-bold">0</div>
    </div>
    <div class="bg-white rounded-xl p-4 shadow">
      <div class="text-gray-500">Aujourd'hui</div>
      <div id="today" class="text-3xl font-bold">0</div>
    </div>
    <div class="bg-white rounded-xl p-4 shadow">
      <div class="text-gray-500">À venir (24h)</div>
      <div id="soon" class="text-3xl font-bold">0</div>
    </div>
    <div class="bg-white rounded-xl p-4 shadow">
      <div class="text-gray-500">En retard</div>
      <div id="late" class="text-3xl font-bold">0</div>
    </div>
  </div>

  <div class="bg-white rounded-xl shadow p-5 mb-6">
    <h2 class="font-bold text-xl mb-4">Nouveau rendez-vous</h2>
    <div class="grid md:grid-cols-5 gap-3">
      <input id="patient" class="border p-2 rounded" placeholder="Patient">
      <input id="motif" class="border p-2 rounded" placeholder="Motif">
      <input id="date" type="date" class="border p-2 rounded">
      <input id="heure" type="time" class="border p-2 rounded">
      <button onclick="ajouter()" class="bg-blue-600 text-white rounded px-4">Ajouter</button>
    </div>
  </div>

  <div class="bg-yellow-50 border-l-4 border-yellow-500 rounded-xl p-5 mb-6">
    <h2 class="font-bold text-xl">🔔 Rappels (24 prochaines heures)</h2>
    <div id="rappels" class="mt-3 space-y-2"></div>
  </div>

  <div class="bg-white rounded-xl shadow p-5">
    <h2 class="font-bold text-xl mb-4">Liste des rendez-vous</h2>
    <table class="w-full border-collapse">
      <thead>
      <tr class="bg-gray-200">
        <th class="p-2">Patient</th>
        <th>Motif</th>
        <th>Date</th>
        <th>Heure</th>
        <th>Action</th>
      </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
let rdvs = JSON.parse(localStorage.getItem("rdvs") || "[]");

if (Notification.permission !== "granted") {
  Notification.requestPermission();
}

function save() {
  localStorage.setItem("rdvs", JSON.stringify(rdvs));
}

function ajouter() {
  const p = patient.value.trim();
  const m = motif.value.trim();
  const d = date.value;
  const h = heure.value;
  if (!p || !d || !h) {
    alert("Complétez les champs obligatoires.");
    return;
  }
  rdvs.push({ patient: p, motif: m, date: d, heure: h, notif: false });
  save();
  patient.value = "";
  motif.value = "";
  date.value = "";
  heure.value = "";
  afficher();
}

function supprimer(i) {
  if (confirm("Supprimer ce rendez-vous ?")) {
    rdvs.splice(i, 1);
    save();
    afficher();
  }
}

function afficher() {
  const tb = document.getElementById("tbody");
  const rapp = document.getElementById("rappels");
  tb.innerHTML = "";
  rapp.innerHTML = "";
  let total = rdvs.length, today = 0, soon = 0, late = 0;
  const now = new Date();

  /* Correction bug UTC : date locale et non UTC */
  const y = now.getFullYear();
  const mo = String(now.getMonth() + 1).padStart(2, "0");
  const da = String(now.getDate()).padStart(2, "0");
  const todayStr = y + "-" + mo + "-" + da;

  rdvs.sort((a, b) => (a.date + a.heure).localeCompare(b.date + b.heure));

  rdvs.forEach((r, i) => {
    const dt = new Date(r.date + "T" + r.heure);
    const diff = (dt - now) / 36e5; /* heures restantes */

    if (r.date === todayStr) today++;

    /* Rappels dans les 24h */
    if (diff >= 0 && diff <= 24) {
      soon++;
      const minutesRestantes = Math.round(diff * 60);
      let indicateur = "";
      if (diff <= 0.5) {
        indicateur = " <span style='color:red;font-weight:bold'>⏰ DANS " + minutesRestantes + " MIN</span>";
      } else {
        indicateur = " <span style='color:#888'>dans " + Math.round(diff) + "h</span>";
      }
      rapp.innerHTML += '<div class="bg-white p-3 rounded shadow">'
        + "<b>" + r.patient + "</b> — " + r.date + " " + r.heure + indicateur
        + "<br>" + (r.motif || "")
        + "</div>";

      /* NOTIFICATION : uniquement 30 min avant le RDV */
      if (Notification.permission === "granted" && !r.notif && diff >= 0 && diff <= 0.5) {
        new Notification("Rappel RDV — 30 minutes", {
          body: r.patient + " à " + r.heure + (r.motif ? " (" + r.motif + ")" : ""),
          icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>"
        });
        r.notif = true;
        save();
      }
    }

    if (diff < 0) late++;

    /* Protection XSS basique */
    const safePatient = r.patient.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const safeMotif = (r.motif || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    tb.innerHTML += '<tr class="border-b">'
      + "<td class='p-2'>" + safePatient + "</td>"
      + "<td class='p-2'>" + safeMotif + "</td>"
      + "<td class='p-2'>" + r.date + "</td>"
      + "<td class='p-2'>" + r.heure + "</td>"
      + "<td class='p-2'><button onclick='supprimer(" + i + ")' class='bg-red-600 text-white px-3 py-1 rounded'>Supprimer</button></td>"
      + "</tr>";
  });

  if (!rapp.innerHTML) {
    rapp.innerHTML = "<p>Aucun rendez-vous dans les prochaines 24 heures.</p>";
  }

  document.getElementById("total").textContent = total;
  document.getElementById("today").textContent = today;
  document.getElementById("soon").textContent = soon;
  document.getElementById("late").textContent = late;
}

afficher();

/* Vérifie toutes les 30 secondes pour capper le créneau 30 min */
setInterval(afficher, 30000);
</script>
</body>
</html>
